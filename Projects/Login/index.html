<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Login Page</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap');

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

.container{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    flex-direction: column;
    gap: 30px;
    background-color: #25252b;
}

.box{
    position: relative;
    width: 250px;
}

.box input{
    width: 100%;
    padding: 10px;
    border: 1px solid #ffffff40;
    background-color: #25252b;
    border-radius: 5px;
    outline: none;
    color: #fff;
    font-size: 1em;
}

.box span{
    position: absolute;
    left: 0;
    padding: 10px;
    pointer-events: none;
    font-size: 1em;
    color: rgba(255, 255, 255, 0.25);
    text-transform: uppercase;
    font-weight: 500;
    letter-spacing: 0.2em;
    transition: 0.5s;
}

.box input:valid ~ span,
.box input:focus ~ span{
    color: #ef233c;
    transform: translateX(10px) translateY(-7px);
    font-size: 0.65em;
    padding: 0 10px;
    background-color: #25252b;
    border: 1px solid #ef233c;
    border-radius: 5px;

}

.box input:valid,
.box input:focus{
    border: 1px solid #ef233c;
}

h1{
    color: #ef233c;
}

.button{
    border: 2px solid #ef233c;
    border-radius: 5px;
    color: #ef233c;
    background-color: #25252b;
    padding: 12px 20px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 0.1em;
    cursor: pointer;

}
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Crispin's Website</h1><br>
        <div class="box">
            <input type="text" required="required">
            <span>Name</span>
        </div>
        <div class="box">
            <input type="text" required="required">
            <span>Email Id</span>
        </div>
        <div class="box">
            <input type="password" required="required">
            <span>Password</span>
        </div>
        <button class="button">LOGIN IN</button>
    </div>
</body>
</html>
